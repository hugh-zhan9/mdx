name: Build MDX

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS arm64
    runs-on: macos-14
    env:
      TARGET: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test

      - name: Test Rust
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ env.TARGET }}

      - name: Build sidecars
        env:
          TAURI_TARGET_TRIPLE: ${{ env.TARGET }}
        run: npm run build:sidecars

      - name: Build app
        env:
          TAURI_TARGET_TRIPLE: ${{ env.TARGET }}
        run: npx tauri build --target ${{ env.TARGET }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdx-macos-arm64
          path: |
            src-tauri/target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ env.TARGET }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ env.TARGET }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
