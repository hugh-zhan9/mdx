[package]
name = "mdx"
version = "0.2.0"
description = "MDX desktop workspace"
authors = ["Jayden Wang"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "mdx"

[[bin]]
name = "mdx-cli"
path = "src/bin/mdx_cli.rs"

[lib]
name = "mdx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
notify = "6"
pdf-extract = "0.10.0"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tempfile = "3"
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSNotification", "NSOperation", "NSValue", "NSString", "block2"] }
