[package]
name = "mdx"
version = "0.2.0"
description = "MDX desktop workspace"
authors = ["Jayden Wang"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "mdx"

[lib]
name = "mdx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
