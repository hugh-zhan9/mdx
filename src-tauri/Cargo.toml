[package]
name = "mdx"
version = "0.2.0"
description = "MDX desktop workspace"
authors = ["Jayden Wang"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "mdx"

[[bin]]
name = "mdx-cli"
path = "src/bin/mdx_cli.rs"

[lib]
name = "mdx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
trash = "5"

[dev-dependencies]
tempfile = "3"
