[package]
name = "pdf-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
font-core = { version = "0.1.0", path = "../font-core" }
layout-core = { path = "../layout-core" }
lopdf = "0.35"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsetter = "0.2.6"
ttf-parser = "0.21"

[dev-dependencies]
tempfile = "3"
