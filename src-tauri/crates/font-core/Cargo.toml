[package]
name = "font-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.21"
font-kit = "0.13"
log = "0.4"
parking_lot = "0.12"
lru = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-text = "20.1.0"

[dev-dependencies]
